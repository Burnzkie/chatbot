<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GroqChat — AI Conversation</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300e5ff'/%3E%3Cstop offset='100%25' stop-color='%237b61ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='18' fill='black'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --panel:     #16161f;
      --border:    #2a2a3a;
      --accent:    #00e5ff;
      --accent2:   #7b61ff;
      --text:      #e8e8f0;
      --muted:     #6b6b88;
      --user-bg:   #1a1a2e;
      --bot-bg:    #13131c;
      --radius:    14px;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      overflow: hidden;
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.4;
    }

    /* ── GLOW BLOBS ── */
    .blob {
      position: fixed; border-radius: 50%;
      filter: blur(90px); pointer-events: none; z-index: 0;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .blob-1 { width:380px;height:380px; background:rgba(0,229,255,.07); top:-80px; left:-80px; animation-delay:0s; }
    .blob-2 { width:300px;height:300px; background:rgba(123,97,255,.08); bottom:-60px; right:-60px; animation-delay:-6s; }
    @keyframes drift { from{transform:translate(0,0)} to{transform:translate(30px,20px)} }

    /* ── LAYOUT ── */
    #app {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 100vh;
      height: 100vh;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 24px 20px;
      gap: 16px;
      overflow: hidden;
      height: 100vh;
    }

    .logo {
      display: flex; align-items: center; gap: 10px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 18px;
    }
    .logo-text {
      font-family: var(--font-head);
      font-size: 20px; font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo-text span { color: var(--accent); }

    /* search */
    .search-wrap {
      position: relative;
    }
    .search-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }
    #search-input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px 10px 38px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13.5px;
      outline: none;
      transition: border-color .2s;
    }
    #search-input::placeholder { color: var(--muted); }
    #search-input:focus { border-color: var(--accent); }

    /* section label */
    .section-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }

    /* ── SIDEBAR TABS ── */
    .sidebar-tabs {
      display: flex; gap: 6px;
    }
    .tab-btn {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      transition: all .2s;
    }
    .tab-btn.active {
      background: rgba(0,229,255,.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    .tab-panel { display: none; flex: 1; min-height: 0; overflow: hidden; flex-direction: column; }
    .tab-panel.active { display: flex; }

    /* suggestions */
    #suggestions {
      flex: 1; overflow-y: auto;
    }
    #suggestions::-webkit-scrollbar { width: 4px; }
    #suggestions::-webkit-scrollbar-track { background: transparent; }
    #suggestions::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* history list */
    #history-list {
      flex: 1; overflow-y: auto;
    }
    #history-list::-webkit-scrollbar { width: 4px; }
    #history-list::-webkit-scrollbar-track { background: transparent; }
    #history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .history-item {
      display: flex; align-items: center; gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .15s;
      position: relative;
    }
    .history-item:hover {
      border-color: var(--accent);
      background: rgba(0,229,255,.04);
      transform: translateX(3px);
    }
    .history-item.active-chat {
      border-color: var(--accent2);
      background: rgba(123,97,255,.08);
    }
    .history-icon { font-size: 14px; flex-shrink: 0; }
    .history-info { flex: 1; overflow: hidden; }
    .history-title {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text);
    }
    .history-date { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .history-delete {
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-size: 14px; padding: 2px 4px;
      border-radius: 4px;
      opacity: 0; transition: opacity .2s, color .2s;
      flex-shrink: 0;
    }
    .history-item:hover .history-delete { opacity: 1; }
    .history-delete:hover { color: #ff4d4d; }

    .history-empty {
      text-align: center; color: var(--muted);
      font-size: 13px; padding: 24px 12px;
    }
    .history-empty div { font-size: 28px; margin-bottom: 8px; }

    /* suggestions */
    .suggestion-chip {
      display: block; width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      margin-bottom: 8px;
      transition: border-color .2s, background .2s, transform .15s;
    }
    .suggestion-chip:hover {
      border-color: var(--accent);
      background: rgba(0,229,255,.05);
      transform: translateX(3px);
    }
    .chip-icon { margin-right: 8px; }

    /* new chat button */
    #new-chat-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 10px;
      padding: 12px;
      color: #000;
      font-family: var(--font-head);
      font-size: 14px; font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
      letter-spacing: 0.3px;
    }
    #new-chat-btn:hover { opacity: .9; transform: translateY(-1px); }

    /* ── MAIN CHAT ── */
    #main {
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }

    /* header */
    #chat-header {
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(10,10,15,.6);
      backdrop-filter: blur(10px);
    }
    #chat-header h2 {
      font-family: var(--font-head);
      font-size: 17px; font-weight: 700;
    }
    .header-right {
      display: flex; align-items: center; gap: 14px;
    }

    /* online/offline badge */
    .status-dot {
      display: flex; align-items: center; gap: 7px;
      font-size: 12.5px; color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #2dce89;
      box-shadow: 0 0 8px #2dce89;
      animation: pulse-dot 2s ease-in-out infinite;
      transition: background .3s, box-shadow .3s;
    }
    .dot.offline { background: #ff4d4d; box-shadow: 0 0 8px #ff4d4d; animation: none; }
    @keyframes pulse-dot {
      0%,100%{opacity:1} 50%{opacity:.4}
    }

    /* clock badge */
    #clock-badge {
      display: flex; align-items: center; gap: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px; color: var(--muted);
      white-space: nowrap;
      font-family: var(--font-body);
    }
    #clock-badge svg { flex-shrink: 0; }
    #clock-time { font-variant-numeric: tabular-nums; letter-spacing: 0.3px; }

    /* location badge */
    #location-badge {
      display: flex; align-items: center; gap: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px; color: var(--muted);
      cursor: pointer;
      transition: border-color .2s, color .2s;
      white-space: nowrap;
    }
    #location-badge:hover { border-color: var(--accent); color: var(--text); }
    #location-badge.granted { color: var(--accent); border-color: rgba(0,229,255,.3); }
    #location-badge.denied  { color: #ff4d4d; border-color: rgba(255,77,77,.3); }
    #location-badge svg { flex-shrink: 0; }

    /* messages */
    #messages {
      flex: 1; overflow-y: auto;
      padding: 28px;
      display: flex; flex-direction: column; gap: 20px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* welcome */
    #welcome {
      margin: auto;
      text-align: center;
      max-width: 480px;
      animation: fadeUp .5s ease both;
    }
    #welcome .big-icon { font-size: 48px; margin-bottom: 16px; }
    #welcome h1 {
      font-family: var(--font-head);
      font-size: 28px; font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #welcome p { color: var(--muted); font-size: 15px; }

    /* message bubbles */
    .msg {
      display: flex; gap: 12px;
      animation: fadeUp .3s ease both;
      max-width: 780px;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(12px) }
      to   { opacity:1; transform:translateY(0) }
    }
    .msg.user { flex-direction: row-reverse; align-self: flex-end; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 36px; height: 36px; border-radius: 10px;
      display: grid; place-items: center;
      font-size: 16px; flex-shrink: 0;
    }
    .msg.user .avatar { background: linear-gradient(135deg,#7b61ff,#b388ff); }
    .msg.bot  .avatar { background: linear-gradient(135deg,#00e5ff22,#00e5ff44); border:1px solid var(--border); }

    .bubble {
      padding: 13px 17px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.65;
      max-width: 640px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border: 1px solid #2a2a4a;
      border-top-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }

    /* typing indicator */
    .typing .bubble {
      display: flex; gap: 5px; align-items: center;
      padding: 16px 20px;
    }
    .typing .bubble span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      animation: blink 1.2s ease-in-out infinite;
    }
    .typing .bubble span:nth-child(2) { animation-delay:.2s; }
    .typing .bubble span:nth-child(3) { animation-delay:.4s; }
    @keyframes blink {
      0%,80%,100%{opacity:.2;transform:scale(.8)}
      40%{opacity:1;transform:scale(1.1)}
    }

    /* search results */
    .search-results-inline {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--muted);
      max-width: 640px;
      margin-left: 48px;
    }
    .search-results-inline strong { color: var(--accent); }

    /* ── INPUT AREA ── */
    #input-area {
      padding: 20px 28px;
      border-top: 1px solid var(--border);
      background: rgba(10,10,15,.7);
      backdrop-filter: blur(10px);
    }
    #input-wrap {
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      transition: border-color .2s;
    }
    #input-wrap:focus-within { border-color: var(--accent); }

    #user-input {
      flex: 1;
      background: transparent;
      border: none; outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14.5px;
      resize: none;
      max-height: 140px;
      min-height: 24px;
      line-height: 1.6;
    }
    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 38px; height: 38px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 9px;
      cursor: pointer;
      display: grid; place-items: center;
      transition: opacity .2s, transform .15s;
    }
    #send-btn:hover { opacity:.9; transform:scale(1.05); }
    #send-btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
    #send-btn svg { color:#000; }

    .input-hint {
      margin-top: 8px;
      font-size: 12px; color: var(--muted);
      text-align: center;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      #app { grid-template-columns: 1fr; }
      #sidebar { display: none; }
    }
  </style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div id="app">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div class="logo-text">Groq<span>Chat</span></div>
    </div>

    <!-- Tabs -->
    <div class="sidebar-tabs">
      <button class="tab-btn active" data-tab="history" onclick="switchTab('history')">💬 History</button>
      <button class="tab-btn" data-tab="prompts" onclick="switchTab('prompts')">💡 Prompts</button>
    </div>

    <!-- History Tab -->
    <div class="tab-panel active" id="tab-history">
      <div id="history-list"></div>
    </div>

    <!-- Prompts Tab -->
    <div class="tab-panel" id="tab-prompts">
      <div class="section-label" style="margin-bottom:10px;">Quick Prompts</div>
      <div class="search-wrap" style="margin-bottom:12px;">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input id="search-input" type="text" placeholder="Search suggestions..." />
      </div>
      <div id="suggestions"></div>
    </div>

    <button id="new-chat-btn">+ New Chat</button>
  </aside>

  <!-- MAIN -->
  <main id="main">
    <header id="chat-header">
      <h2>AI Conversation</h2>
      <div class="header-right">
        <!-- Real-time clock -->
        <div id="clock-badge">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span id="clock-time">--:--:--</span>
          <span id="clock-ampm" style="font-size:10px; opacity:.7;"></span>
        </div>
        <!-- Location badge -->
        <div id="location-badge" onclick="requestLocation()" title="Click to detect location">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            <circle cx="12" cy="9" r="2.5"/>
          </svg>
          <span id="location-text">Detect Location</span>
        </div>
        <!-- Online/offline status -->
        <div class="status-dot">
          <div class="dot" id="online-dot"></div>
          <span id="online-label">Groq — Ultra Fast</span>
        </div>
      </div>
    </header>

    <div id="messages">
      <div id="welcome">
        <div class="big-icon">⚡</div>
        <h1>GroqChat</h1>
        <p>Blazing-fast AI powered by Groq.<br/>Ask anything or pick a suggestion from the sidebar.</p>
      </div>
    </div>

    <div id="input-area">
      <div id="input-wrap">
        <textarea id="user-input" rows="1" placeholder="Type your message… (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="send-btn" disabled>
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9l20-7z"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </main>
</div>

<script>
  // ── SUGGESTIONS DATA ──
  const ALL_SUGGESTIONS = [
    { icon: "🌍", text: "Explain climate change simply" },
    { icon: "💻", text: "Write a Python hello world" },
    { icon: "🍜", text: "Give me a quick pasta recipe" },
    { icon: "📝", text: "Help me write a professional email" },
    { icon: "🧠", text: "What is machine learning?" },
    { icon: "🚀", text: "Top 5 productivity tips" },
    { icon: "🎨", text: "How does color theory work?" },
    { icon: "💡", text: "Explain quantum computing" },
    { icon: "📊", text: "How to read a balance sheet?" },
    { icon: "🗣️", text: "Teach me a Spanish greeting" },
    { icon: "🔒", text: "Basic cybersecurity tips" },
    { icon: "🌱", text: "Simple meditation techniques" },
  ];

  const suggestionsEl = document.getElementById('suggestions');
  const searchInput   = document.getElementById('search-input');
  const MODEL         = "llama-3.3-70b-versatile";  // Model to use
  const messagesEl    = document.getElementById('messages');
  const userInput     = document.getElementById('user-input');
  const sendBtn       = document.getElementById('send-btn');
  const newChatBtn    = document.getElementById('new-chat-btn');
  const welcomeEl     = document.getElementById('welcome');

  let conversationHistory = [];
  let currentChatId       = null;

  // ── TAB SWITCHER ──
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.getElementById('tab-history').classList.toggle('active', tab === 'history');
    document.getElementById('tab-prompts').classList.toggle('active',  tab === 'prompts');
  }

  // ── CHAT HISTORY (localStorage) ──
  function loadAllChats() {
    try { return JSON.parse(localStorage.getItem('groqchat_history') || '[]'); }
    catch { return []; }
  }
  function saveAllChats(chats) {
    localStorage.setItem('groqchat_history', JSON.stringify(chats));
  }
  function saveCurrentChat() {
    if (!currentChatId || conversationHistory.length === 0) return;
    const chats = loadAllChats();
    const idx   = chats.findIndex(c => c.id === currentChatId);
    const title = conversationHistory[0]?.content?.slice(0, 40) || 'New Chat';
    const entry = { id: currentChatId, title, messages: conversationHistory, date: new Date().toISOString() };
    if (idx >= 0) chats[idx] = entry; else chats.unshift(entry);
    saveAllChats(chats);
    renderHistory();
  }
  function deleteChat(id, e) {
    e.stopPropagation();
    const chats = loadAllChats().filter(c => c.id !== id);
    saveAllChats(chats);
    if (currentChatId === id) startNewChat();
    renderHistory();
  }
  function loadChat(id) {
    const chats = loadAllChats();
    const chat  = chats.find(c => c.id === id);
    if (!chat) return;
    currentChatId       = id;
    conversationHistory = chat.messages;
    // re-render messages
    messagesEl.innerHTML = '';
    chat.messages.forEach(m => {
      if (m.role === 'user' || m.role === 'assistant') {
        const role = m.role === 'user' ? 'user' : 'bot';
        const div  = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = `<div class="avatar">${role==='user'?'👤':'⚡'}</div><div class="bubble">${escapeHtml(m.content)}</div>`;
        messagesEl.appendChild(div);
      }
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;
    renderHistory();
    switchTab('history');
  }
  function renderHistory() {
    const chats = loadAllChats();
    const list  = document.getElementById('history-list');
    if (chats.length === 0) {
      list.innerHTML = `<div class="history-empty"><div>💬</div>No chats yet.<br/>Start a conversation!</div>`;
      return;
    }
    list.innerHTML = chats.map(c => {
      const d     = new Date(c.date);
      const label = d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
      const active = c.id === currentChatId ? 'active-chat' : '';
      return `
        <div class="history-item ${active}" onclick="loadChat('${c.id}')">
          <span class="history-icon">💬</span>
          <div class="history-info">
            <div class="history-title">${escapeHtml(c.title)}</div>
            <div class="history-date">${label}</div>
          </div>
          <button class="history-delete" onclick="deleteChat('${c.id}', event)" title="Delete">✕</button>
        </div>`;
    }).join('');
  }
  function startNewChat() {
    saveCurrentChat();
    currentChatId       = 'chat_' + Date.now();
    conversationHistory = [];
    messagesEl.innerHTML = '';
    messagesEl.appendChild(welcomeEl);
    welcomeEl.style.display = '';
    renderHistory();
  }

  // init
  currentChatId = 'chat_' + Date.now();
  renderHistory();

  // ── REAL-TIME CLOCK ──
  const clockTime = document.getElementById('clock-time');
  const clockAmpm = document.getElementById('clock-ampm');

  function updateClock() {
    const now  = new Date();
    let h      = now.getHours();
    const m    = String(now.getMinutes()).padStart(2, '0');
    const s    = String(now.getSeconds()).padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    clockTime.textContent = `${String(h).padStart(2,'0')}:${m}:${s}`;
    clockAmpm.textContent = ampm;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── ONLINE / OFFLINE STATUS ──
  const onlineDot   = document.getElementById('online-dot');
  const onlineLabel = document.getElementById('online-label');

  function updateOnlineStatus() {
    if (navigator.onLine) {
      onlineDot.classList.remove('offline');
      onlineLabel.textContent = 'Online — Ultra Fast';
    } else {
      onlineDot.classList.add('offline');
      onlineLabel.textContent = 'Offline — No connection';
    }
  }
  updateOnlineStatus();
  window.addEventListener('online',  updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);

  // ── LOCATION DETECTION ──
  const locationBadge = document.getElementById('location-badge');
  const locationText  = document.getElementById('location-text');
  let userLocation    = null;

  async function requestLocation() {
    if (!navigator.geolocation) {
      locationText.textContent = 'Not supported';
      locationBadge.classList.add('denied');
      return;
    }
    locationText.textContent = 'Detecting...';
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude } = pos.coords;
        userLocation = { latitude, longitude };
        try {
          // reverse geocode using free API (no key needed)
          const res  = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`);
          const data = await res.json();
          const city    = data.address.city || data.address.town || data.address.village || data.address.county || '';
          const country = data.address.country_code?.toUpperCase() || '';
          locationText.textContent = city ? `${city}, ${country}` : `${latitude.toFixed(2)}, ${longitude.toFixed(2)}`;
          locationBadge.classList.add('granted');
          // inject location into system context
          userLocation.label = locationText.textContent;
        } catch {
          locationText.textContent = `${latitude.toFixed(2)}, ${longitude.toFixed(2)}`;
          locationBadge.classList.add('granted');
        }
      },
      (err) => {
        locationText.textContent = err.code === 1 ? 'Access denied' : 'Unavailable';
        locationBadge.classList.add('denied');
      },
      { timeout: 8000 }
    );
  }

  // auto-detect on load (will prompt browser permission)
  requestLocation();
  function renderSuggestions(filter = '') {
    const filtered = ALL_SUGGESTIONS.filter(s =>
      s.text.toLowerCase().includes(filter.toLowerCase())
    );
    suggestionsEl.innerHTML = filtered.map(s => `
      <button class="suggestion-chip" onclick="useSuggestion(${JSON.stringify(s.text)})">
        <span class="chip-icon">${s.icon}</span>${s.text}
      </button>
    `).join('');
  }
  renderSuggestions();
  searchInput.addEventListener('input', e => renderSuggestions(e.target.value));

  function useSuggestion(text) {
    userInput.value = text;
    userInput.dispatchEvent(new Event('input'));
    sendMessage();
  }

  // ── AUTO-RESIZE TEXTAREA ──
  userInput.addEventListener('input', () => {
    sendBtn.disabled = userInput.value.trim() === '';
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
  });

  // ── ENTER TO SEND ──
  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });
  sendBtn.addEventListener('click', sendMessage);

  newChatBtn.addEventListener('click', startNewChat);

  // ── ADD MESSAGE ──
  function addMessage(role, text) {
    if (welcomeEl.parentElement) welcomeEl.remove();

    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="avatar">${role === 'user' ? '👤' : '⚡'}</div>
      <div class="bubble">${escapeHtml(text)}</div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addTyping() {
    if (welcomeEl.parentElement) welcomeEl.remove();
    const div = document.createElement('div');
    div.className = 'msg bot typing';
    div.id = 'typing-indicator';
    div.innerHTML = `
      <div class="avatar">⚡</div>
      <div class="bubble"><span></span><span></span><span></span></div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── SEND MESSAGE ──
  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    const apiKey = 'hidden-on-server';
    // UI reset
    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;
    userInput.disabled = true;

    addMessage('user', text);
    conversationHistory.push({ role: 'user', content: text });

    addTyping();

    try {
      // ✅ Calls our backend — API key is hidden on the server!
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: MODEL,
          messages: [
            { role: 'system', content: `You are a helpful, friendly, and concise AI assistant.${userLocation?.label ? ` The user is located in ${userLocation.label}.` : ''}` },
            ...conversationHistory
          ],
          max_tokens: 1024,
          temperature: 0.7,
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error?.message || 'API error');
      }

      const reply = data.choices[0].message.content;
      conversationHistory.push({ role: 'assistant', content: reply });

      removeTyping();
      addMessage('bot', reply);

    } catch (err) {
      removeTyping();
      addMessage('bot', `❌ Error: ${err.message}\n\nPlease check your API key and try again.`);
    }

    userInput.disabled = false;
    userInput.focus();
  }
</script>
</body>
</html>
